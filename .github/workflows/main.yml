name: Build Android APK (Kino Studio 1.4.0)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK (API 35)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Locate or unpack Android project
        run: |
          PROJECT_DIR=""
          LATEST_ZIP=$(find . -maxdepth 3 -not -path '*/.*' -name "*.zip" | while read -r z; do
            if unzip -Z1 "$z" 2>/dev/null | grep -q "settings.gradle.kts"; then
              TS=$(git log -1 --format="%ct" -- "$z" 2>/dev/null || echo 0)
              echo "${TS} ${z}"
            fi
          done | sort -nr | head -n 1 | cut -d' ' -f2-)

          if [ -n "$LATEST_ZIP" ]; then
            echo "Unpacking $LATEST_ZIP..."
            rm -rf _unpacked_project
            mkdir -p _unpacked_project
            unzip -q -o "$LATEST_ZIP" -d _unpacked_project
            FOUND_SETTINGS=$(find _unpacked_project -maxdepth 4 -name "settings.gradle.kts" | head -n 1)
            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_DIR=$(dirname "$FOUND_SETTINGS")
            fi
          elif [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            FOUND_SETTINGS=$(find . -maxdepth 4 -not -path '*/.*' -name "settings.gradle.kts" | head -n 1)
            if [ -n "$FOUND_SETTINGS" ]; then
              PROJECT_DIR=$(dirname "$FOUND_SETTINGS")
            fi
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Android project not found!"
            ls -la
            exit 1
          fi

          echo "Project located at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compile and Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace --no-daemon

      - name: Collect APK output
        run: |
          mkdir -p apk_output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" apk_output/KinoStudio-1.4.0-Debug.apk
          test -f apk_output/KinoStudio-1.4.0-Debug.apk
          ls -lh apk_output/KinoStudio-1.4.0-Debug.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: apk_output/KinoStudio-1.4.0-Debug.apk
          name: KinoStudio-1.4.0-APK
          retention-days: 30
          if-no-files-found: error
